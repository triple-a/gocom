name: "sec scan"

on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.70.0"
  GOVULNCHECK_VERSION: "v1.3.0"

jobs:
  sec-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.work'
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $HOME/.local/bin v"$TRIVY_VERSION"
      - name: Run security scan with aquasecurity trivy
        run: make trivy-scan
      - name: Install govuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Run security scan with govuln
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/triple-a/*
        run: |
          git config --global url."https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com".insteadOf "https://github.com"
          make vuln-scan-all
      - name: Secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@8a44db8bcd6498e13e72e0838ffd42ffdab0f46c # v3.88.28
        with:
          extra_args: --only-verified
